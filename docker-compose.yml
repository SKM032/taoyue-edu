# ============================================================
# 桃悦智科 Docker Compose 生产部署编排
# 用法：
#   cp .env.docker.example .env   # 按需修改配置
#   docker compose up -d --build
# 说明：统一网关 Nginx 监听 80，路径分发见 deploy/nginx-gateway.conf
#   /            -> 客户端 (web:3000)
#   /admin/      -> 管理后台 (admin:80)
#   /api/ /static/ -> 后端 API (api:8000)
#   m.xin1024.top -> 移动端 H5 静态托管（./m-static，本地构建后上传）
# 移动端 H5 采用"本地构建上传"：运行 deploy/build_m_local.bat，把静态产物
# 上传到服务器 ./m-static，由网关 nginx 直接托管，服务器无需再构建 mobile。
# ============================================================

name: taoyue-edu

services:
  # ---------- MySQL 8 ----------
  mysql:
    image: mysql:8.0
    container_name: taoyue-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root123456}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-taoyue_edu}
      MYSQL_USER: ${MYSQL_USER:-taoyue}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-taoyue123456}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    # 生产环境不暴露 3306，仅 compose 内网可访问（通过 mysql:3306 连接）。
    # 如需远程连库排查，可临时打开下面这行并设 MYSQL_PORT=3306（默认已注释掉）。
    # ports:
    #   - "${MYSQL_PORT:-3306}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ---------- Redis 7 ----------
  redis:
    image: redis:7-alpine
    container_name: taoyue-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- 后端 API (FastAPI) ----------
  api:
    build:
      context: ./taoyue-edu-api
    container_name: taoyue-api
    restart: unless-stopped
    environment:
      # 运行环境：development / staging / production（生产会触发安全校验，见 app/config.py）
      APP_ENV: ${APP_ENV:-production}
      # 数据库 / Redis（通过 Compose 网络访问服务名）
      DATABASE_URL: mysql+pymysql://${MYSQL_USER:-taoyue}:${MYSQL_PASSWORD:-taoyue123456}@mysql:3306/${MYSQL_DATABASE:-taoyue_edu}
      REDIS_URL: redis://redis:6379/0
      # 安全
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-taoyue-edu-jwt-secret-key-2024-very-strong-and-secure}
      JWT_ACCESS_TOKEN_EXPIRE_MINUTES: ${JWT_ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      JWT_REFRESH_TOKEN_EXPIRE_DAYS: ${JWT_REFRESH_TOKEN_EXPIRE_DAYS:-7}
      # CORS（JSON 数组，包含你的部署域名）
      CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost","http://127.0.0.1"]}
      DEBUG: ${DEBUG:-false}
      # 阿里云 OSS（可选，不填则图片保存到本地 /app/static）
      OSS_ACCESS_KEY_ID: ${OSS_ACCESS_KEY_ID:-}
      OSS_ACCESS_KEY_SECRET: ${OSS_ACCESS_KEY_SECRET:-}
      OSS_ENDPOINT: ${OSS_ENDPOINT:-oss-cn-hangzhou.aliyuncs.com}
      OSS_BUCKET_NAME: ${OSS_BUCKET_NAME:-}
      OSS_CDN_DOMAIN: ${OSS_CDN_DOMAIN:-}
      # 短信（阿里云号码认证服务 / 短信认证服务）
      SMS_ACCESS_KEY: ${SMS_ACCESS_KEY:-}
      SMS_SECRET_KEY: ${SMS_SECRET_KEY:-}
      SMS_SIGN_NAME: ${SMS_SIGN_NAME:-恒创联众}
      SMS_TEMPLATE_ID: ${SMS_TEMPLATE_ID:-100001}
      SMS_SCHEME_NAME: ${SMS_SCHEME_NAME:-}
      # 微信支付（APIv3，企业级）——必须传入容器，否则生产环境走模拟支付
      WECHAT_PAY_APP_ID: ${WECHAT_PAY_APP_ID:-}
      WECHAT_PAY_MCH_ID: ${WECHAT_PAY_MCH_ID:-}
      WECHAT_PAY_APIV3_KEY: ${WECHAT_PAY_APIV3_KEY:-}
      WECHAT_PAY_SERIAL_NO: ${WECHAT_PAY_SERIAL_NO:-}
      WECHAT_PAY_PRIVATE_KEY: ${WECHAT_PAY_PRIVATE_KEY:-}
      WECHAT_PAY_NOTIFY_URL: ${WECHAT_PAY_NOTIFY_URL:-}
      WECHAT_PAY_API_KEY: ${WECHAT_PAY_API_KEY:-}
      # 支付宝
      ALIPAY_APP_ID: ${ALIPAY_APP_ID:-}
      ALIPAY_PRIVATE_KEY: ${ALIPAY_PRIVATE_KEY:-}
      ALIPAY_PUBLIC_KEY: ${ALIPAY_PUBLIC_KEY:-}
      # 密钥文件路径（文件方案，指向容器内 /app/certs 下文件）
      ALIPAY_PRIVATE_KEY_PATH: ${ALIPAY_PRIVATE_KEY_PATH:-}
      ALIPAY_PUBLIC_KEY_PATH: ${ALIPAY_PUBLIC_KEY_PATH:-}
      ALIPAY_NOTIFY_URL: ${ALIPAY_NOTIFY_URL:-}
      ALIPAY_SANDBOX: ${ALIPAY_SANDBOX:-false}
      ALIPAY_SANDBOX_USE_DEFAULT_KEY: ${ALIPAY_SANDBOX_USE_DEFAULT_KEY:-false}
    volumes:
      - ./taoyue-edu-api/certs:/app/certs
      - api_static:/app/static
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 首次启动：初始化管理员 -> 启动服务（create_admin.py 幂等，可安全重复执行）
    command: >
      sh -c "python create_admin.py &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000
             --workers ${API_WORKERS:-2} --proxy-headers --forwarded-allow-ips '*'"
    expose:
      - "8000"

  # ---------- 客户端 (Next.js 14) ----------
  web:
    build:
      context: ./taoyue-edu
      args:
        # 浏览器通过网关访问 API 的地址（部署后改成你的域名）
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api/v1}
        NEXT_PUBLIC_API_HOST: ${NEXT_PUBLIC_API_HOST:-http://localhost}
    container_name: taoyue-web
    restart: unless-stopped
    depends_on:
      - api
    expose:
      - "3000"

  # ---------- 移动端 / H5 (uni-app) ----------
  # ⚠️ 已改为"本地构建 + 上传静态产物"方案：在本地运行 deploy/build_m_local.bat
  #   把构建出的 H5 上传到服务器 ./m-static，由网关 nginx 直接托管。
  #   这样服务器不再执行 npm ci 构建（避免 npm ci 卡住/构建慢的问题）。
  # 如需恢复服务器构建，取消注释下面这段，并注释掉 nginx 里的 m-static 挂载和
  #   nginx-gateway.conf 中 m.xin1024.top 的静态托管 location。
  # mobile:
  #   build:
  #     context: ./m
  #     args:
  #       # H5 访问 API 的地址（部署后改成 http://你的域名/api/v1）
  #       API_BASE: ${MOBILE_API_URL:-http://localhost/api/v1}
  #       API_HOST: ${MOBILE_API_HOST:-http://localhost}
  #   container_name: taoyue-mobile
  #   restart: unless-stopped
  #   depends_on:
  #     - api
  #   expose:
  #     - "80"

  # ---------- 管理后台 (Vite + React) ----------
  admin:
    build:
      context: ./taoyue_edu_admin
      args:
        # 部署子路径（与管理后台入口一致）
        VITE_BASE: ${VITE_BASE:-/admin/}
    container_name: taoyue-admin
    restart: unless-stopped
    depends_on:
      - api
    expose:
      - "80"

  # ---------- 统一网关 (Nginx) ----------
  nginx:
    image: nginx:alpine
    container_name: taoyue-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx-gateway.conf:/etc/nginx/conf.d/default.conf:ro
      # 移动端 H5 静态产物（本地 build_m_local.bat 构建上传），网关直接托管
      - ./m-static:/usr/share/nginx/m-static:ro
      # HTTPS 证书目录（阿里云下载的 .pem / .key 放到 ./cert 下）
      - ./cert:/etc/nginx/ssl:ro
    depends_on:
      - api
      - web
      - admin

  # ---------- 数据库管理工具 (Adminer, 浏览器查看 MySQL) ----------
  adminer:
    image: adminer:4
    container_name: taoyue-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
  redis_data:
  api_static:
