# 管理后台内部 Nginx：托管静态文件 + SPA 路由回退
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 上传大小限制（与网关保持一致）
    client_max_body_size 50m;

    # SPA 路由：找不到文件时回退 index.html，前端路由刷新不 404
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}
